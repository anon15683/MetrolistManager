name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race ./...

      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Verify modules
        run: |
          go mod tidy -diff
          go mod verify

      - name: Vet Windows build
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...

      - name: Compile Windows tests
        run: |
          mkdir -p "${RUNNER_TEMP}/windows-tests"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o "${RUNNER_TEMP}/windows-tests" ./...

      - name: Cross-compile Windows manager
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui" -o /tmp/MetrolistManager.exe .
